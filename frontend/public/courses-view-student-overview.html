<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Student Course View — Overview</title>
  <link rel="stylesheet" href="../src/css/courses-view-student-overview.css">
</head>

<body data-page="overview">
  <main class="layout">

    <!-- TAB HEADER -->
    <header class="course-header">
        <nav class="course-nav">
            <a href="courses-view-student-overview.html"
            class="nav-item" data-page="overview">Overview</a>

            <a href="courses-view-student-activities.html"
            class="nav-item" data-page="activities">Activities</a>

            <a href="courses-view-student-announcements.html"
            class="nav-item" data-page="announcements">Announcements</a>
        </nav>
    </header>


    <div class="card" id="course-view">

      <!-- COURSE SUMMARY ONLY -->
      <section class="preview-section">

        <div>
          <div class="course-title" id="course-title"></div>
          <div class="course-subtitle" id="course-subTitle"></div>
        </div>

        <div class="course-category">
          <span id="course-category"></span>
        </div>

        <div class="course-description-box">
          <span id="course-description"></span>
        </div>


        <div class="course-info-field">
          <strong>Instructor</strong>
          <span id="course-instructor"></span>
          <button class="leave" id="leave-btn">Leave</button>
        </div>





      </section>

      <div class="wizard-actions">
        <button class="ghost" id="back-btn">← Back</button>
      </div>

    </div>

  </main>

  <script src="../src/js/courses-view-student-overview.js"></script>
  <script src="../src/js/courses-view-student.js"></script>
</body>
</html>
