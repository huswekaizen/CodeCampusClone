<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Home — Instructor — CodeCampus</title>
  <link rel="stylesheet" href="../src/css/home.css" />
  <link rel="stylesheet" href="../src/css/courses-view-student-leaderboard.css" />
</head>
<body>
  <div class="background-image" aria-hidden="true"></div>

  <header class="topbar" role="banner">
    <div class="topbar-left">
      <a href="#" class="logo-link" aria-label="Home">
        <img id="site-logo" src="../src/images/site-logo.png" alt="logo placeholder" />
      </a>
      <div class="search">
        <input id="search" placeholder="Search…" aria-label="Search" />
      </div>
    </div>
    <div class="topbar-right">
      <button class="icon-btn" id="notifications" title="Notifications">🔔</button>
      <button class="icon-btn" id="messages" title="Messages">💬</button>
      <div class="profile" aria-hidden="true">
        <div class="avatar avatar-sm" aria-hidden="true"></div>
        <div class="profile-info">
          <div id="fullNameTop" class="profile-name"></div>
          <div id="roleTop" class="profile-role">Instructor</div>
        </div>
      </div>
    </div>
  </header>

  <div class="layout" role="main">
    <nav class="sidebar" id="sidebar" aria-label="Primary navigation">
      <ul class="nav-list">
        <li class="nav-item" onclick="location.href='./home-student.html'">Home</li>
        <li class="nav-item" onclick="location.href='./joined-courses-student.html'">Joined Courses</li>
        <li class="nav-item" onclick="location.href='./public-courses.html'">Public Courses</li>
        <li class="nav-item">Challenges</li>
        <li class="nav-item active" onclick="location.href='./leaderboard-student.html'">Leaderboard</li>
        <li class="nav-item">Community</li>
        <li class="nav-item">Settings</li>
        <a id="logout"><li class="nav-item">Logout</li></a>
      </ul>
      <button class="collapse-btn" id="collapseBtn" aria-pressed="false">⮜</button>
    </nav>

    <main class="content-area">
      <!-- Welcome / Summary -->
        <section class="leaderboard-container">
            <header class="leaderboard-header">
                <h1>All Students Leaderboard</h1>
                <p>Ranking based on total points and completed activities</p>
            </header>

            <div class="leaderboard-table-wrapper">
                <table class="leaderboard-table">
                <thead>
                    <tr>
                      <th>Rank</th>
                      <th>Student</th>
                      <th>Points</th>
                      <th>Completed Activities</th>
                      <th>Courses Joined</th>
                    </tr>
                </thead>

                <tbody id="leaderboard-body">
                    <!-- 
                    JS will inject rows here
                    Example structure per row:

                    <tr>
                        <td>#</td>
                        <td>Student Name</td>
                        <td>Points</td>
                        <td>Progress Bar</td>
                    </tr>
                    -->
                </tbody>
                </table>
            </div>

            <!-- Optional empty state -->
            <div class="leaderboard-empty hidden" id="leaderboard-empty">
                No students enrolled yet.
            </div>

        </section>
    </main>
  </div>

  <script type="module" src="../src/js/home.js"></script>
  <script type="module" src="../src/js/leaderboard-student.js"></script>
</body>
</html>
